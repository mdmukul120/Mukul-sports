name: Automated DZRI TV Scraper

on:
  schedule:
    # প্রতি ৫ মিনিট পরপর অটোমেশন রান হবে
    - cron: '*/5 * * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি রান করার সুবিধার্থে

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update match data [skip ci]" && git push)
